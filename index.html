<!DOCTYPE html>
<html>
<head>
    <title>I'm Sorry ❤️</title>

    <style>
        body {
            background-color: #ffe6ee;
            text-align: center;
            font-family: Arial, sans-serif;
            padding-top: 80px;
        }

        .card {
            background-color: white;
            width: 350px;
            margin: auto;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #ff4f81;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        .bouquet {
            font-size: 70px;
            margin: 20px;
        }

        button {
            background-color: #ff4f81;
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e83e70;
        }

        #message {
            display: none;
            margin-top: 20px;
            color: #ff4f81;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="bouquet">
            💐
        </div>

        <h1>I'm Sorry 🥺</h1>

        <p>
            I know you're angry with me...
        </p>

        <p>
            Please forgive me ❤️
        </p>

        <button onclick="saySorry()">
            Sorry Fida ❤️
        </button>

        <div id="message">
            I really really love you! 🥺❤️<br>
            Please don't be angry anymore 💕
        </div>

    </div>

    <script>
        function saySorry() {
            document.getElementById("message").style.display = "block";
        }
    </script>

</body>
</html>
